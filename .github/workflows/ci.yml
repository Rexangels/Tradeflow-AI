name: TradeFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and Django tests
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-for-production"
      DJANGO_ADMIN_EMAIL: "admin@tradeflow.local"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations match models
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test platform_api.tests

  frontend:
    name: Frontend type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run lint --workspace @tradeflow/web

      - name: Run frontend tests
        run: npm run test --workspace @tradeflow/web

      - name: Build frontend
        run: npm run build --workspace @tradeflow/web
